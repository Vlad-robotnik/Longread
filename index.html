<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NFT и удалённая работа</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;600&subset=cyrillic&display=swap">
<style>/* Layout: sticky оглавление слева, колонка текста 700px, широкие интерактивные «вставки» внутри колонки */
:root {
  --bg: #f7f2fe;
  --surface: #ffffff;
  --surface-2: #efe7fb;
  --ink: #1c1430;
  --muted: #5f5778;
  --line: #d9cdee;
  --accent: #4b2a8a;
  --accent-ink: #ffffff;
  --accent-soft: #ece3fa;
  --amber: #7a6aa3;
  --amber-soft: #efe7fb;
  --ok: #2e7d5b;
  --ok-soft: #e1efe8;
  --bad: #a8403f;
  --bad-soft: #f3e1e0;
  --f-display: "Unbounded", "Arial Black", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14101d; --surface: #1d1729; --surface-2: #281f3a; --ink: #ece7f7; --muted: #a99fc2;
    --line: #382d52; --accent: #b39bea; --accent-ink: #14101d; --accent-soft: #2e2441;
    --amber: #a99fc2; --amber-soft: #2a2140; --ok: #6cc79f; --ok-soft: #17302a; --bad: #f09090; --bad-soft: #3a2123;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14101d; --surface: #1d1729; --surface-2: #281f3a; --ink: #ece7f7; --muted: #a99fc2;
  --line: #382d52; --accent: #b39bea; --accent-ink: #14101d; --accent-soft: #2e2441;
  --amber: #a99fc2; --amber-soft: #2a2140; --ok: #6cc79f; --ok-soft: #17302a; --bad: #f09090; --bad-soft: #3a2123;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 17px/1.7 var(--f-body);
  padding-left: 0; padding-right: 0;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bg); z-index: 60;
}
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0 0 1.1em; }

/* progress + topbar */
.progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; width: 100%; z-index: 70; background: transparent; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s linear; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 8px var(--gutter-r) 8px var(--gutter);
  display: flex; align-items: center; gap: 12px;
}
.topbar .now { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 500 13px var(--f-mono); color: var(--muted); }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 14px; line-height: 1.3;
}
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"], .btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.menu-btn { display: none; }

/* hero */
.hero-band { background: #1a1426; color: #fff; position: relative; overflow: hidden; padding-left: var(--gutter); padding-right: var(--gutter-r); min-height: 560px; display: flex; }
.hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 80% center; }
.hero-band::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, #1a1426 0%, rgba(26,20,38,.92) 34%, rgba(26,20,38,.25) 68%, rgba(26,20,38,0) 100%); }
.hero { position: relative; z-index: 2; padding: 64px 0 48px; max-width: 1180px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; justify-content: center; }
.eyebrow { font: 500 12px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.8); display: flex; gap: 10px 16px; flex-wrap: wrap; }
.eyebrow b { background: #fff; color: #1a1426; font-weight: 600; padding: 2px 10px; border-radius: 99px; }
.hero h1 { font: 600 clamp(32px, 6vw, 68px)/1.05 var(--f-display); letter-spacing: -.02em; margin: 22px 0 20px; max-width: 14ch; }
.hero h1 em { font-style: normal; color: #fff; box-shadow: inset 0 -.16em 0 rgba(255,255,255,.3); }
.lead { font-size: clamp(18px, 2.2vw, 21px); line-height: 1.55; max-width: 38ch; color: rgba(255,255,255,.85); margin: 0 0 8px; }

.chain { margin-top: 36px; border: 1px solid rgba(255,255,255,.28); background: rgba(26,20,38,.62); backdrop-filter: blur(4px); border-radius: 10px; overflow: hidden; position: relative; max-width: 760px; color: #fff; }
.chain-head { display: flex; justify-content: space-between; gap: 12px; padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,.2); font: 500 12px var(--f-mono); color: rgba(255,255,255,.7); }
.chain-track { display: flex; gap: 0; padding: 16px 14px; overflow: hidden; align-items: stretch; }
.blk { flex: 0 0 150px; border: 1.5px solid rgba(255,255,255,.55); border-radius: 6px; padding: 9px 11px; margin-right: 24px; position: relative; font: 500 11.5px/1.5 var(--f-mono); animation: blkIn .6s ease-out both; }
.blk::after { content: ""; position: absolute; right: -25px; top: 50%; width: 24px; height: 1.5px; background: rgba(255,255,255,.55); }
.blk:last-child::after { display: none; }
.blk .id { font: 600 11px var(--f-mono); color: #fff; }
.blk .tok { font: 600 14px var(--f-display); margin: 4px 0; letter-spacing: -.01em; }
.blk .h { color: rgba(255,255,255,.6); word-break: break-all; }
.blk.fresh { background: rgba(255,255,255,.16); border-color: #fff; }
@keyframes blkIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }

/* toc inline */
.toc-inline { max-width: 1180px; margin: 0 auto; padding: 36px var(--gutter-r) 8px var(--gutter); }
.toc-card h2 { font: 600 13px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.toc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.toc-grid a { display: flex; align-items: flex-end; min-height: 84px; padding: 14px 16px; text-decoration: none; color: var(--ink); background: var(--sc-soft); border-radius: 12px; border: 1px solid var(--line); border-bottom: 4px solid var(--sc); font-weight: 600; line-height: 1.35; font-size: 15.5px; transition: transform .15s; }
.toc-grid a:hover { transform: translateY(-3px); }

/* page grid */
.page { max-width: 1180px; margin: 0 auto; padding: 24px var(--gutter-r) 80px var(--gutter); display: grid; grid-template-columns: 225px minmax(0, 1fr); gap: 56px; }
.side { position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - 90px); overflow: auto; }
.side h2 { font: 600 12px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.side ol { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
.side a { display: block; padding: 5px 0 5px 14px; margin-left: -2px; border-left: 2px solid transparent; font-size: 14.5px; line-height: 1.4; color: var(--muted); text-decoration: none; }
.side a.sub { padding-left: 28px; font-size: 13.5px; }
.side a:hover { color: var(--ink); }
.side li { --acc: var(--sc); }
.side a.cur { color: var(--sc); border-left-color: var(--sc); font-weight: 600; }
.side a { border-left-color: transparent; }
.side li:not(.x) > a:not(.sub):not(.cur)::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--sc); margin-right: 8px; }
.side-tools { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; }

article { min-width: 0; }
.sec { --accent: var(--sc); --accent-soft: var(--surface-2); --accent-ink: var(--sc-on); background: var(--sc-soft); border: 1px solid var(--line); border-radius: 22px; padding: 22px clamp(16px, 3.4vw, 36px) 12px; margin-bottom: 26px; scroll-margin-top: 70px; }
.sec h2 { font: 600 clamp(24px, 3.6vw, 34px)/1.18 var(--f-display); letter-spacing: -.015em; margin: 16px 0 22px; }
.sec h3 { font: 600 clamp(19px, 2.4vw, 23px)/1.3 var(--f-display); letter-spacing: -.01em; margin: 40px 0 16px; scroll-margin-top: 70px; box-shadow: inset 0 -.42em 0 var(--sc-mark); width: fit-content; max-width: 100%; }
.sec-tag { display: inline-flex; font: 600 12px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; background: var(--sc); color: var(--sc-on); padding: 4px 12px; border-radius: 99px; }
.anchor { color: var(--muted); text-decoration: none; margin-left: .35em; opacity: 0; font-weight: 400; }
h2:hover .anchor, h3:hover .anchor, .anchor:focus-visible { opacity: 1; }

.cite { font: 500 .78em var(--f-mono); text-decoration: none; padding: 0 1px; white-space: nowrap; }
.cite:hover { text-decoration: underline; }

.term { border-bottom: 1.5px dotted var(--accent); cursor: help; position: relative; background: none; border-top: 0; border-left: 0; border-right: 0; padding: 0; font: inherit; color: inherit; }
.term .tip {
  position: absolute; left: 0; bottom: calc(100% + 8px); width: min(300px, 80vw); z-index: 20; padding: 10px 12px; border-radius: 8px;
  background: var(--ink); color: var(--bg); font: 400 13.5px/1.5 var(--f-body); text-align: left; display: none; box-shadow: 0 6px 24px rgba(0,0,0,.25);
}
.term:hover .tip, .term:focus .tip, .term.open .tip { display: block; }

.pull { margin: 34px 0; padding: 18px 22px; background: var(--surface); border-radius: 12px; border-left: 8px solid var(--sc); font: 500 clamp(19px, 2.6vw, 24px)/1.4 var(--f-display); letter-spacing: -.01em; }
.pull small { display: block; margin-top: 10px; font: 400 13px var(--f-mono); color: var(--muted); letter-spacing: 0; }

figure { margin: 34px 0; }
figure.wide { margin-left: 0; }
.fig-frame { background: #fff; border: 2px solid var(--sc); border-radius: 10px; padding: 14px; }
.fig-frame img { display: block; margin: 0 auto; max-width: 100%; height: auto; }
figcaption { margin-top: 10px; font-size: 14px; line-height: 1.5; color: var(--muted); }
figcaption b { color: var(--ink); font-weight: 600; }

/* widget shell */
.widget { border: 2px solid var(--sc); background: var(--surface); border-radius: 12px; margin: 34px 0; overflow: hidden; }
.w-head { padding: 12px 18px; background: var(--sc); color: var(--sc-on); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.w-head b { font: 600 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--sc-on); }
.w-head span { font-size: 14px; color: var(--sc-on); opacity: .9; }
.w-body { padding: 20px 18px; }

/* stepper */
.flow { display: grid; gap: 8px; }
.step {
  display: grid; grid-template-columns: 34px 1fr; gap: 12px; text-align: left; align-items: start;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; width: 100%;
}
.step .n { font: 600 14px/1.5 var(--f-mono); color: var(--muted); }
.step .t { font-weight: 600; line-height: 1.35; }
.step .d { font-size: 14px; color: var(--muted); display: block; line-height: 1.45; margin-top: 2px; }
.step.on { border-color: var(--accent); background: var(--accent-soft); }
.step.on .n { color: var(--accent); }
.step.done .n { color: var(--ok); }
.branch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.flow-ctl { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
.flow-note { margin-top: 12px; padding: 12px 14px; border-radius: 8px; background: var(--amber-soft); font-size: 15px; line-height: 1.55; }

/* fungible demo */
.fung { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.fung h4 { margin: 0 0 8px; font: 600 14px var(--f-mono); letter-spacing: .02em; }
.coins { display: flex; gap: 8px; flex-wrap: wrap; }
.coin { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--f-mono); border: 2px solid var(--ink); background: var(--surface); transition: transform .3s; }
.coin.sel { outline: 3px solid var(--accent); }
.coin.u1 { background: #f1e9fd; color: #11151c; border-radius: 50%; }
.coin.u2 { background: #d9c9f3; color: #11151c; border-radius: 14px; }
.coin.u3 { background: #b79ee6; color: #11151c; border-radius: 50% 50% 8px 8px; }
.coin.u4 { background: #fbf8ff; color: #11151c; border-radius: 8px 50% 50% 8px; }
.coin.fg { background: var(--amber-soft); border-color: var(--amber); color: var(--ink); }
.fung p.res { grid-column: 1 / -1; margin: 6px 0 0; font-size: 15px; min-height: 3.4em; }

/* layers */
.layers { display: grid; gap: 6px; }
.layer { text-align: left; display: grid; grid-template-columns: 1fr; border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; }
.layer .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-weight: 600; }
.layer .row i { font: 400 12px var(--f-mono); color: var(--muted); font-style: normal; }
.layer .body { font-size: 14.5px; color: var(--muted); line-height: 1.55; margin-top: 6px; display: none; }
.layer.on { border-color: var(--accent); background: var(--accent-soft); }
.layer.on .body { display: block; color: var(--ink); }
.layer.l3d { border-style: dashed; border-color: var(--amber); }
.layer.l3d.on { background: var(--amber-soft); }
.layer-stack-label { font: 500 12px var(--f-mono); color: var(--muted); margin: 4px 0; letter-spacing: .06em; text-transform: uppercase; }

/* access simulator */
.sim { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.sim-checks { display: grid; gap: 8px; }
.chk { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.chk input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.chk b { display: block; font-weight: 600; line-height: 1.35; }
.chk small { color: var(--muted); font-size: 13.5px; line-height: 1.4; display: block; }
.pipe { display: grid; gap: 0; }
.pipe .node { padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 14.5px; line-height: 1.4; display: flex; gap: 10px; align-items: center; }
.pipe .node .m { font: 700 14px var(--f-mono); width: 20px; text-align: center; flex: none; }
.pipe .node.ok { border-color: var(--ok); background: var(--ok-soft); }
.pipe .node.ok .m { color: var(--ok); }
.pipe .node.no { border-color: var(--bad); background: var(--bad-soft); }
.pipe .node.no .m { color: var(--bad); }
.pipe .node.skip { opacity: .45; }
.pipe .link { width: 2px; height: 12px; background: var(--line); margin-left: 21px; }
.verdict { padding: 14px 16px; border-radius: 8px; font-weight: 600; line-height: 1.45; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); border: 1.5px solid var(--ok); }
.verdict.no { background: var(--bad-soft); color: var(--bad); border: 1.5px solid var(--bad); }
.verdict span { display: block; font-weight: 400; color: var(--ink); font-size: 14.5px; margin-top: 4px; }

/* table */
.tbl-wrap { overflow-x: auto; border: 2px solid var(--sc); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 15px; line-height: 1.5; }
th { text-align: left; font: 600 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--sc-on); padding: 12px 14px; background: var(--sc); }
td { padding: 12px 14px; vertical-align: top; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 600; width: 22%; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr.on td { background: var(--accent-soft); }
.tbl-note { font-size: 14px; color: var(--muted); margin-top: 8px; }

/* decision helper */
.q { padding: 12px 0; border-bottom: 1px dashed var(--line); }
.q:last-of-type { border-bottom: 0; }
.q p { margin: 0 0 8px; font-weight: 500; line-height: 1.45; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 18px; font-size: 14.5px; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.rec { margin-top: 14px; padding: 16px; border-radius: 8px; background: var(--amber-soft); line-height: 1.55; }
.rec b { display: block; font: 600 17px/1.3 var(--f-display); margin-bottom: 6px; }

/* video + audio */
.video { border-radius: 12px; overflow: hidden; border: 2px solid var(--sc); background: var(--surface); }
.video .frame { aspect-ratio: 16 / 9; max-width: 100%; width: 100%; background: #1a1426; position: relative; display: grid; place-items: center; color: #fff; overflow: hidden; border: 0; padding: 0; }
.video .frame img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: .5; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video .poster { text-align: center; padding: 20px; position: relative; z-index: 1; }
.video .play { width: 78px; height: 78px; border-radius: 50%; background: #fff; display: grid; place-items: center; margin: 0 auto 14px; transition: transform .2s; }
.video .play::after { content: ""; border-left: 23px solid #1a1426; border-top: 14px solid transparent; border-bottom: 14px solid transparent; margin-left: 7px; }
.video .frame:hover .play { transform: scale(1.08); }
.video .poster strong { font: 600 clamp(15px, 2.4vw, 21px)/1.3 var(--f-display); display: block; }
.video .poster span { font: 400 13px var(--f-mono); color: rgba(255,255,255,.75); display: block; margin-top: 6px; }
.video .meta { padding: 12px 16px; font-size: 14px; color: var(--muted); display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.video .meta p { margin: 0; flex: 1 1 260px; }
.video .meta a.btn { text-decoration: none; color: var(--ink); white-space: nowrap; }

.banner { display: block; width: 100%; height: auto; border-radius: 14px; border: 1px solid var(--line); margin: 0 0 22px; }
.w-img { display: block; width: 100%; height: auto; border-radius: 10px; margin: 0 0 18px; border: 1px solid var(--line); }
figure.ill img { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); }

/* cases / links */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 22px 0; }
.card { display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0; overflow: hidden; text-decoration: none; color: var(--ink); min-width: 0; }
.card:hover { border-color: var(--sc); }
.card img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 7; object-fit: cover; border-bottom: 1px solid var(--line); }
.card .cb { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px; flex: 1; }
.card .k { font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--sc); }
.card .t { font-weight: 600; line-height: 1.35; }
.card .s { font-size: 14px; color: var(--muted); line-height: 1.45; }
.card .go { margin-top: auto; padding-top: 6px; font: 500 12px var(--f-mono); color: var(--accent); }

.takeaways { display: grid; gap: 12px; margin: 24px 0; counter-reset: t; }
.take { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 16px 18px; display: grid; grid-template-columns: 38px 1fr; gap: 12px; }
.take::before { counter-increment: t; content: counter(t); font: 600 18px/34px var(--f-display); color: var(--sc-on); background: var(--sc); border-radius: 50%; width: 34px; height: 34px; text-align: center; }
.take b { display: block; margin-bottom: 2px; line-height: 1.35; }
.take span { color: var(--muted); font-size: 15.5px; line-height: 1.55; display: block; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.srcs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.src { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 14.5px; line-height: 1.55; scroll-margin-top: 80px; }
.src:target { border-color: var(--sc); box-shadow: 0 0 0 4px var(--sc-mark); }
.src .no { font: 600 13px var(--f-mono); color: var(--accent); }
.src .type { display: inline-block; font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); margin-bottom: 4px; }
.src a { overflow-wrap: anywhere; }
.src.extra .no { color: var(--amber); }

footer { max-width: 1180px; margin: 0 auto; padding: 24px var(--gutter-r) 60px var(--gutter); color: var(--muted); font-size: 14px; display: flex; gap: 12px 32px; flex-wrap: wrap; justify-content: space-between; }
footer a { color: var(--muted); }

/* drawer */
.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 80; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(330px, 88vw); background: var(--bg); z-index: 90; padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 20px max(20px, env(safe-area-inset-left, 0px)); overflow: auto; border-right: 1px solid var(--line); }
.drawer .close { float: right; }

@media (max-width: 960px) {
  .page { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .menu-btn { display: inline-block; }
  body { font-size: 16.5px; }
}
@media (max-width: 700px) {
  .hero-band::before { background: linear-gradient(180deg, rgba(26,20,38,.94) 0%, rgba(26,20,38,.82) 60%, rgba(26,20,38,.55) 100%); }
}
@media (max-width: 560px) {
  .branch, .fung { grid-template-columns: 1fr; }
  .hero { padding-top: 40px; }
  .w-body { padding: 16px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .blk { animation: none; }
  .progress > i { transition: none; }
}


/* ── плотные блоки на всю ширину, без скруглений ── */
.page { max-width: none; margin: 0; padding: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 0; }
.page.collapsed { grid-template-columns: minmax(0, 1fr); }
.page.collapsed .side-col { display: none; }
.side-col { background: var(--surface-2); border-right: 1px solid var(--line); padding: 0 16px 0 var(--gutter); }
.side { top: calc(52px + env(safe-area-inset-top, 0px)); padding: 24px 0; max-height: calc(100vh - 52px); }
.side-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
.side-top h2 { margin: 0; }
.side-top .btn { padding: 3px 10px; font-size: 13px; }
.menu-btn.show { display: inline-block; }
article { max-width: none; }
.sec { border-radius: 0; border: 0; margin: 0; padding: 64px var(--gutter-r) 48px var(--gutter); }
.sec-in { max-width: 860px; margin: 0 auto; }
.sec-head { text-align: center; margin-bottom: 26px; }
.sec-head h2 { text-align: center; margin: 18px auto 0; max-width: 20ch; }
.sec h3 { margin-top: 44px; }
.banner { margin-bottom: 34px; }
.widget, .card, .banner, .w-img, figure.ill img, .fig-frame, .tbl-wrap, .pull, .take, .src, .video, .rec, .flow-note,
.step, .layer, .chk, .node, .verdict, .chain, .blk, .seg, .q, .src .type, .sec-tag { border-radius: 0 !important; }
.btn { border-radius: 2px; }
.eyebrow b { border-radius: 0; }
.hero-band, .topbar { border-radius: 0; }
.video .frame img.bg { object-fit: contain; }
.side-col .side ol { border-left-color: var(--line); }
@media (max-width: 960px) {
  .page { grid-template-columns: minmax(0, 1fr); }
  .side-col { display: none; }
  .sec { padding-top: 48px; }
}


/* ── одна кнопка-стрелка для содержания; шире текст ── */
.toc-toggle { position: fixed; z-index: 55; top: 50%; left: 290px; transform: translateY(-50%); width: 15px; height: 64px; border: 0; background: var(--accent); color: var(--accent-ink); font: 600 26px/1 var(--f-mono); cursor: pointer; display: grid; place-items: center; padding: 0 0 4px; transition: left .2s ease; border-radius: 0; }
.toc-toggle.closed { left: 0; }
.toc-toggle:hover { filter: brightness(1.15); }
.sec-in { max-width: 1120px; }
body { font-size: 18px; }
.sec-head h2 { max-width: 28ch; }
@media (max-width: 960px) { .toc-toggle { display: none; } body { font-size: 16.5px; } }
@media (prefers-reduced-motion: reduce) { .toc-toggle { transition: none; } }

.sec h3 { box-shadow: none; }

.chain-track { justify-content: flex-end; }
.blk { flex: 0 0 150px; }
.blk:last-child { margin-right: 0; }
.sec-head { margin-bottom: 30px; }
.banner { margin-top: 0; }
.chain-track { justify-content: flex-start; }
@media (max-width: 780px) { .chain-track { justify-content: flex-end; } }
:root[data-theme="dark"] .banner, :root[data-theme="dark"] .w-img, :root[data-theme="dark"] figure.ill img, :root[data-theme="dark"] .card img, :root[data-theme="dark"] .fig-frame img { filter: brightness(.78) saturate(.9); }
:root[data-theme="dark"] .fig-frame { background: #cfc6e0; }

.sec-in > p { text-indent: 1.6em; }

.page { position: relative; }
.toc-rail { position: absolute; top: 0; bottom: 0; left: 290px; width: 15px; z-index: 55; transition: left .2s ease; }
.page.collapsed .toc-rail { left: 0; }
.toc-toggle, .toc-toggle.closed { position: sticky; top: calc(50vh - 32px); left: auto; transform: none; transition: none; }S
@media (max-width: 960px) { .toc-rail { display: none; } }
@media (prefers-reduced-motion: reduce) { .toc-rail { transition: none; } }

/* ── содержание поверх страницы: контент не сдвигается, панель уже ── */
.page, .page.collapsed { display: block; position: relative; }
.side-col, .page.collapsed .side-col { display: block; position: absolute; top: 0; bottom: 0; left: 0; width: 240px; z-index: 40; padding: 0 12px 0 var(--gutter); transition: transform .2s ease, visibility 0s; }
.page.collapsed .side-col { transform: translateX(-100%); visibility: hidden; transition: transform .2s ease, visibility 0s .2s; }
.toc-rail { left: 240px; }
.page.collapsed .toc-rail { left: 0; }
@media (min-width: 961px) { .sec { padding-left: calc(225px + var(--gutter)); } }
@media (max-width: 960px) { .side-col { display: none !important; } }
@media (prefers-reduced-motion: reduce) { .side-col, .page.collapsed .side-col { transition: none; } }

/* ── контент по центру всего экрана, панель содержания его не смещает и не перекрывает ── */
@media (min-width: 961px) {
  .sec { padding-left: var(--gutter); }
  .sec-in { max-width: min(1120px, calc(100vw - 532px)); }
}

/* кнопка прикреплена к самой панели: зазора быть не может */
.page .toc-wrap { position: absolute; top: 0; bottom: 0; left: 0; width: 240px; z-index: 40; transition: transform .2s ease; }
.page.collapsed .toc-wrap { transform: translateX(-240px); }
.page .toc-wrap .side-col, .page.collapsed .toc-wrap .side-col { position: absolute; inset: 0; transform: none; transition: visibility 0s; visibility: visible; border-right: 0; }
.page.collapsed .toc-wrap .side-col { visibility: hidden; transition: visibility 0s .2s; }
.page .toc-wrap .toc-rail, .page.collapsed .toc-wrap .toc-rail { left: 100%; transition: none; }
@media (max-width: 960px) { .page .toc-wrap { display: none; } }
@media (prefers-reduced-motion: reduce) { .page .toc-wrap { transition: none; } }
